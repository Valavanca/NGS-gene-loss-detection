[project]
name = "ngs-gene-loss-detection"
version = "0.1.0"
description = "Detecting focal PTEN deletions in TSO500 panel sequencing data with XGBoost"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fire>=0.7.1",
    "ipywidgets>=8.1.7",
    "loguru>=0.7.3",
    "nbformat>=5.10.4",
    "pandas>=2.3.2",
    "plotly>=6.3.0",
    "pypalettes>=0.1.6",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "shap>=0.48.0",
    "syne-tune[extra]>=0.3.3",
    "tensorboardx>=2.6.4",
    "xgboost>=3.0.5",
]
